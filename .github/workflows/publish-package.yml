name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@atpaawej'

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo (Packages, Web & CLI)
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("cli/package.json", "utf8"));
            pkg.name = "@atpaawej/openboard";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            fs.writeFileSync("cli/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm publish --workspace=openboard-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
