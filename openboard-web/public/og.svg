<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0C0D10"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="#2563EB" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="950" cy="200" r="280" fill="#2563EB" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="250" cy="450" r="220" fill="#3B82F6" fill-opacity="0.05" filter="blur(70px)"/>
  
  <!-- Logo Sparkle -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="18" fill="#14151A" stroke="#2563EB" stroke-opacity="0.4"/>
    <path d="M36 14C36 26.15 26.15 36 14 36C26.15 36 36 45.85 36 58C36 45.85 45.85 36 58 36C45.85 36 36 26.15 36 14Z" fill="#3B82F6"/>
  </g>
  
  <text x="190" y="152" fill="#F3F4F6" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.02em">OpenBoard</text>
  
  <text x="100" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">
    The Secure Local Whiteboard
  </text>
  <text x="100" y="340" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.02em">
    Engineered for Developers &amp; AI Agents
  </text>
  
  <text x="100" y="420" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400">
    ✦ 100% Local-First SQLite (~/.openboard/openboard.db) &nbsp; ✦ 13 Semantic MCP Tools
  </text>
  <text x="100" y="460" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400">
    ✦ Zero Cloud Dependencies &nbsp; ✦ Real-Time Live SSE Sync &nbsp; ✦ MIT Licensed
  </text>
  
  <!-- Terminal Box -->
  <g transform="translate(100, 500)">
    <rect width="600" height="64" rx="12" fill="#121318" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="30" y="40" fill="#10B981" font-family="monospace" font-size="22" font-weight="600">$</text>
    <text x="55" y="40" fill="#F3F4F6" font-family="monospace" font-size="22" font-weight="600">npx openboard-app start</text>
  </g>
  
  <!-- GitHub badge -->
  <g transform="translate(730, 500)">
    <rect width="370" height="64" rx="12" fill="#1A1C24" stroke="#2563EB" stroke-opacity="0.3"/>
    <text x="30" y="40" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="20" font-weight="600">★ Star on GitHub: atpaawej/openboard</text>
  </g>
</svg>
